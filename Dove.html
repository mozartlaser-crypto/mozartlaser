  <style>
    body { font-family: 'Poppins', sans-serif; margin:0; padding:0; background:#f9f9f9; color:#111; }
    .product-container { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; padding:60px 20px; gap:40px; max-width:1200px; margin:auto; }
    .product-images { position:relative; width:500px; height:600px; max-width:90vw; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:12px; background:#f0f0f0; }
    .product-images img { max-width:100%; max-height:100%; object-fit:contain; border-radius:10px; transition:transform 0.4s ease; }
    .dots { position:absolute; bottom:15px; width:100%; display:flex; justify-content:center; z-index:10; }
    .dots::before { content:""; position:absolute; bottom:-7px; width:100px; height:28px; background:rgba(0,0,0,0.4); border-radius:999px; z-index:-1; }
    .dot { width:12px; height:12px; margin:0 5px; background:rgba(255,255,255,0.5); border-radius:50%; cursor:pointer; transition:background-color 0.3s; }
    .dot.active { background:white; }
    .product-info { flex:1; max-width:500px; text-align:left; }
    .product-info h1 { font-size:2rem; margin-bottom:10px; }
    .product-info h3 { margin-bottom:15px; }
    .product-info p { line-height:1.6; margin-bottom:30px; }
    .buttons { display:flex; gap:15px; flex-wrap:wrap; }
    .buttons button { padding:12px 25px; font-size:1rem; border:none; border-radius:999px; cursor:pointer; transition:all 0.3s; }
    .buy-now { background:black; color:white; }
    .buy-now:hover { background:#333; }
    .add-cart, .customize-btn { background:white; color:black; border:1px solid black; }
    .add-cart:hover, .customize-btn:hover { background:#eee; }
    @media(max-width:768px){.product-container{flex-direction:column;text-align:center;}.product-info{text-align:center;}.buttons{justify-content:center;}.product-images{width:90vw;height:90vw;}.dots::before{width:80px;height:26px;}}
  </style>

<!-- CART PANEL -->
<div class="cart-panel" id="cart-panel">
  <h3>Shopping Cart</h3>
  <ul id="cart-items"></ul>
  <p>Total: $<span id="cart-total">0.00</span></p>
  <button id="checkout">Checkout</button>
  <button id="close-cart">Close</button>
</div>

<div class="product-container">
  <!-- Image Section -->
  <div class="product-images" id="imageContainer">
    <img id="product-img" src="" alt="Product Image">
    <div class="dots">
      <span class="dot active" data-index="0"></span>
      <span class="dot" data-index="1"></span>
      <span class="dot" data-index="2"></span>
    </div>
  </div>

  <!-- Info Section -->
  <div class="product-info">
    <h1>Wooden Dove Plaque - Psalm 46:5</h1>
    <h3>$25.00</h3>
    <p>Christian Wall Décor Gift</p>

    <div class="buttons">
      <button class="customize-btn" id="customizeThis" data-product="Wooden Dove Plaque - Psalm 46:5">Customize This Product</button>
      <button class="buy-now" id="buyNow" data-name="Wooden Dove Plaque - Psalm 46:5" data-price="25.00">Buy Now</button>
      <button class="add-cart" id="addToCart">Add to Cart</button>
    </div>
  </div>
</div>

<script>
  const images = [
    "Product Images/Dove with Psalm/Front view.jpg",
    "Product Images/Dove with Psalm/Side-view.jpg",
    "Product Images/Dove with Psalm/Display.jpg",
  ];
  const imgEl = document.getElementById('product-img');
  const dots = document.querySelectorAll('.dot');
  const imageContainer = document.getElementById('imageContainer');
  let currentIndex = 0;

  imgEl.src = images[0];

  dots.forEach((dot, index) => {
    dot.addEventListener('click', () => changeImage(index));
  });

  function changeImage(index) {
    imgEl.src = images[index];
    document.querySelector('.dot.active').classList.remove('active');
    dots[index].classList.add('active');
    currentIndex = index;
  }

  let startX = 0;
  imageContainer.addEventListener('touchstart', (e) => startX = e.touches[0].clientX);
  imageContainer.addEventListener('touchend', (e) => {
    const diff = startX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
      currentIndex = diff > 0 ? (currentIndex + 1) % images.length : (currentIndex - 1 + images.length) % images.length;
      changeImage(currentIndex);
    }
  });

  document.getElementById("addToCart").addEventListener("click", () => {
    addToCart("Wooden Dove Plaque - Psalm 46:5", 25.00);
  });

  document.getElementById('buyNow').addEventListener('click', async () => {
    const button = document.getElementById('buyNow');
    const name = button.dataset.name;
    const price = parseFloat(button.dataset.price);
    if (!name || isNaN(price)) { alert("This product is not properly configured."); return; }
    const singleItemCart = [{ name, price, quantity: 1 }];
    try {
      const response = await fetch("https://mozart-backend.onrender.com/create-checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: singleItemCart })
      });
      const session = await response.json();
      if (session.url) { window.location.href = session.url; } 
      else { alert("Checkout failed. Please try again."); console.error(session); }
    } catch (error) { alert("Something went wrong during checkout."); console.error(error); }
  });

  document.getElementById("customizeThis").addEventListener("click", () => {
    const productName = "Wooden Dove Plaque - Psalm 46:5";
    window.location.href = `create.html?mode=template&product=${encodeURIComponent(productName)}&step=2`;
  });
</script>
