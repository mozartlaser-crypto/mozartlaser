<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>suprise</title>
    <style>
        /* CSS: Styling the game world and animations */
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f0f0f0; 
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game { 
            width: 600px; 
            height: 200px; 
            border-bottom: 2px solid #535353; 
            position: relative; 
            background-color: white;
        }
        #dino { 
            width: 40px; 
            height: 40px; 
            background-color: #535353; 
            position: absolute; 
            bottom: 0; 
            left: 50px; 
        }
        #cactus { 
            width: 20px; 
            height: 40px; 
            background-color: #ff4d4d; 
            position: absolute; 
            bottom: 0; 
            right: -20px; 
        }
        /* Animation for the Dino jump */
        .animate-jump { 
            animation: jump 0.5s linear; 
        }
        @keyframes jump { 
            0% { bottom: 0; } 
            30% { bottom: 100px; } 
            70% { bottom: 100px; } 
            100% { bottom: 0; } 
        }
        /* Animation for the moving Cactus */
        .cactus-move { 
            animation: move 1.5s infinite linear; 
        }
        @keyframes move { 
            0% { right: -20px; } 
            100% { right: 100%; } 
        }
        #score { position: absolute; top: 10px; right: 20px; font-size: 20px; color: #535353; }
    </style>
</head>
<body onclick="jump()" onkeydown="if(event.code==='Space') jump()">
    <div id="game">
        <div id="score">Score: 0</div>
        <div id="dino"></div>
        <div id="cactus" class="cactus-move"></div>
    </div>

    <script>
        // JS: Game Logic and Collision Detection
        const dino = document.getElementById("dino");
        const cactus = document.getElementById("cactus");
        const scoreElement = document.getElementById("score");
        let score = 0;

        function jump() {
            if (!dino.classList.contains("animate-jump")) {
                dino.classList.add("animate-jump");
                setTimeout(() => {
                    dino.classList.remove("animate-jump");
                }, 500);
            }
        }

        // Check for collisions every 10 milliseconds
        let isAlive = setInterval(function() {
            // Get current position of dino and cactus
            let dinoTop = parseInt(window.getComputedStyle(dino).getPropertyValue("top"));
            let cactusLeft = parseInt(window.getComputedStyle(cactus).getPropertyValue("left"));

            // Collision logic: If cactus is under dino and dino is not high enough
            if (cactusLeft < 90 && cactusLeft > 50 && dinoTop >= 150) {
                alert("Game Over! Your Score: " + Math.floor(score/10));
                score = 0;
                location.reload(); // Restart game
            } else {
                score++;
                scoreElement.innerHTML = "Score: " + Math.floor(score/10);
            }
        }, 10);
    </script>
</body>
</html>
